name: Mod のビルド
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: 'main でテスト済み JAR をリリースする'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: 宇宙での建築・艦船テスト
        run: |
          ./gradlew runGameTestServer --no-daemon || {
            grep -E 'LogTestReporter|GameTestServer.*failed'  build/gametest/logs/latest.log | tail -12 | sed 's/^/::error::/'
            exit 1
          }
          grep -F 'AstroDock orbit placement verified' build/gametest/logs/latest.log
          grep -F 'AstroDock ship round trip verified' build/gametest/logs/latest.log
          grep -F 'AstroDock rigid body verified' build/gametest/logs/latest.log
          grep -F 'AstroDock orbit prefetch verified' build/gametest/logs/latest.log
          grep -F 'AstroDock pilot controls verified' build/gametest/logs/latest.log
          grep -F 'AstroDock engine and deck verified' build/gametest/logs/latest.log
          grep -F 'AstroDock shipyard verified' build/gametest/logs/latest.log
          grep -F 'AstroDock planet landing verified' build/gametest/logs/latest.log
          grep 'ASTRO_BENCH blocks=' build/gametest/logs/latest.log | sed 's/.*ASTRO_BENCH/::notice title=Physics benchmark::ASTRO_BENCH/'
        timeout-minutes: 8
      - name: JAR の内容を確認
        run: |
          jar tf build/libs/astrodock-*.jar > "$RUNNER_TEMP/entries"
          grep -Fx 'io/github/python121212/astrodock/AstroDock.class' "$RUNNER_TEMP/entries"
          grep -Fx 'META-INF/mods.toml' "$RUNNER_TEMP/entries"
      - uses: actions/upload-artifact@v4
        with:
          name: AstroDock
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AstroDock
          path: release
      - name: テスト済みの JAR を公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          gh release create "v$version" "release/astrodock-$version.jar" --target "$GITHUB_SHA" --title "AstroDock $version" --notes 'Minecraft 1.20.1・Forge 47.3.0 用です。JAR を mods フォルダーに入れてください。'
