name: Mod のビルド
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: JAR の内容を確認
        run: |
          jar tf build/libs/astrodock-*.jar > "$RUNNER_TEMP/entries"
          grep -Fx 'io/github/python121212/astrodock/AstroDock.class' "$RUNNER_TEMP/entries"
          grep -Fx 'META-INF/mods.toml' "$RUNNER_TEMP/entries"
      - uses: actions/upload-artifact@v4
        with:
          name: AstroDock
          path: build/libs/*.jar
          if-no-files-found: error
